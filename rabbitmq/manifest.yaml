apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-headless
  namespace: roboshop
  labels:
    project: roboshop
    component: rabbitmq
    tier: db
spec:
  ports:
  - protocol: TCP
    port: 5672
    targetPort: 5672
  clusterIP: None #Headless service
  selector:
    project: roboshop
    component: rabbitmq
    tier: db
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: roboshop
  labels:
    project: roboshop
    component: rabbitmq
    tier: db
spec:
  ports:
  - protocol: TCP
    port: 5672 #Service port
    targetPort: 5672 #Container port
  selector:
    project: roboshop
    component: rabbitmq
    tier: db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: roboshop
  labels:
    project: roboshop
    component: rabbitmq
    tier: db
spec:
  selector:
      matchLabels:
        project: roboshop
        component: rabbitmq
        tier: db    
  serviceName: "rabbitmq-headless"
  replicas: 2
  template:
    metadata:
      labels:
        project: roboshop
        component: rabbitmq
        tier: db      
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3
        volumeMounts:
        - name: rabbitmq
          mountPath: /var/lib/rabbitmq
 #PVC
  volumeClaimTemplates:
  - metadata:
      name: rabbitmq
    spec:
      accessModes: [ "ReadWriteOnce"]
      storageClassName: "roboshop-ebs"
      resources:
        requests:
          storage: 1Gi